services:
  - type: web
    name: ai-response-validation-api
    runtime: python

    buildCommand: |
      pip install -r requirements-deploy.txt
      python scripts/embeddings.py

    startCommand: |
      uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: LLM_PROVIDER
        value: openai

      - key: LLM_MODEL
        value: gpt-4o-mini

      - key: MODEL_NAME
        value: all-MiniLM-L6-v2

      - key: VECTOR_DB_PATH
        value: vector_db

      - key: COLLECTION_NAME
        value: knowledge_base

      - key: TOP_K_RESULTS
        value: "5"

      - key: OPENAI_API_KEY
        sync: false